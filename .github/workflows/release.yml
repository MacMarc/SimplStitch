name: Release

# Issue #4: Tag pushen (z.B. `git tag v0.1.0 && git push origin v0.1.0`) → Tests → signierte,
# notarisierte App → notarisiertes DMG → GitHub Release mit dem DMG als Anhang.
# Benötigte Repository-Secrets: siehe docs/RELEASE.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Bestehender Tag, für den ein Release gebaut werden soll (z.B. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    # Notarisierung kann laut manuellem Testlauf über 2 Stunden dauern (siehe Issue #4).
    timeout-minutes: 240
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      TEAM_ID: 6B76PB9TQW
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Version aus Tag ableiten
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Release ${TAG} → Version ${VERSION} (Build ${GITHUB_RUN_NUMBER})"

      - name: Test
        run: |
          xcodebuild test \
            -project SimplStitch.xcodeproj \
            -scheme SimplStitch \
            -destination "platform=macOS,arch=arm64" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Signier-Zertifikat in temporären Schlüsselbund laden
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')"
          test -n "$IDENTITY" || { echo "Kein Developer-ID-Application-Zertifikat im p12 gefunden" >&2; exit 1; }
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Archivieren
        # `archive` statt `build`: nur so fehlt das Debug-Entitlement get-task-allow, das Apple bei
        # der Notarisierung ablehnt (siehe Issue #4).
        run: |
          xcodebuild archive \
            -project SimplStitch.xcodeproj \
            -scheme SimplStitch \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/SimplStitch.xcarchive" \
            -skipMacroValidation \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN"

      - name: Exportieren (Developer ID)
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SimplStitch.xcarchive" \
            -exportOptionsPlist Scripts/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Signieren, notarisieren, DMG bauen
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary_key.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          mkdir -p dist
          Scripts/sign_and_notarize.sh \
            "$RUNNER_TEMP/export/SimplStitch.app" \
            "dist/SimplStitch-${VERSION}.dmg" \
            "SimplStitch ${VERSION}"
          rm "$NOTARY_KEY_PATH"

      - name: GitHub Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{{VERSION}}/${VERSION}/g" .github/release-notes-template.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" "dist/SimplStitch-${VERSION}.dmg" \
            --title "SimplStitch ${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --generate-notes \
            --draft

      - name: Schlüsselbund aufräumen
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
